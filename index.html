// ---------- Web Audio feedback sounds ----------
let audioCtx = null;
let osc = null, oscGain = null, chargePlaying = false;
const AUDIO_ON = true;
function ensureAudio() {
  if (!AUDIO_ON) return false;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return true;
  } catch (e) { return false; }
}
function startCharge() {
  if (!ensureAudio()) return;
  stopCharge();
  osc = audioCtx.createOscillator();
  oscGain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 200;
  oscGain.gain.value = 0.0;
  oscGain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.08);
  osc.connect(oscGain).connect(audioCtx.destination);
  osc.start();
  chargePlaying = true;
}
function setChargePitch(p) {
  if (!chargePlaying || !osc) return;
  const f = 200 + (600 - 200) * p;
  osc.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.03);
  oscGain.gain.setTargetAtTime(0.18 + 0.06 * p, audioCtx.currentTime, 0.03);
}
function stopCharge() {
  if (!chargePlaying) return;
  const t = audioCtx.currentTime;
  try {
    oscGain.gain.cancelScheduledValues(t);
    oscGain.gain.setTargetAtTime(0, t, 0.03);
    osc.stop(t + 0.1);
  } catch (e) {}
  osc = null; oscGain = null; chargePlaying = false;
}
function blip(freq, dur, vol) {
  if (!ensureAudio()) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 1.15, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function playLaunch() { blip(520, 0.12, 0.22); }

function playMiss() { blip(240, 0.16, 0.18); }
function playHurt() { blip(160, 0.22, 0.20); }
function playWin() { blip(760, 0.28, 0.22); }

    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y1); ctx.lineTo(x + w, y1);
    ctx.moveTo(x, y2); ctx.lineTo(x + w, y2);
    ctx.stroke();
    drawWarn(W / 2, (y1 + y2) / 2);
    return;
  }

  if (r.solid) {
    ctx.fillStyle = PALETTE[col].dark;
    ctx.fillRect(x, y1, w, hh);
    ctx.strokeStyle = 'rgba(0,0,0,.25)';
  } else if (r.rainbow) {
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    const ks = Object.keys(PALETTE);
    ks.forEach((k, i) => g.addColorStop(i / (ks.length - 1), PALETTE[k].light));
    ctx.fillStyle = g;
    ctx.fillRect(x, y1, w, hh);
    ctx.strokeStyle = '#8a93a0';
  } else {
    ctx.fillStyle = PALETTE[col].light;
    ctx.fillRect(x, y1, w, hh);
    ctx.strokeStyle = PALETTE[col].dark;
  }
  ctx.lineWidth = 1.5;
  ctx.setLineDash(r.dynamic && !r.solid ? [8, 6] : []);
  ctx.beginPath();
  ctx.moveTo(x, y1); ctx.lineTo(x + w, y1);
  ctx.moveTo(x, y2); ctx.lineTo(x + w, y2);
  ctx.stroke();
  ctx.setLineDash([]);

  if (r.dynamic && !r.solid) {
    const idx = Math.floor(time / r.dynPeriod) % r.dynSeq.length;
    for (let i = 0; i < r.dynSeq.length; i++) {
      ctx.beginPath();
      ctx.arc(W / 2 + (i - (r.dynSeq.length - 1) / 2) * 26, (y1 + y2) / 2, i === idx ? 7 : 4.5, 0, Math.PI * 2);
      ctx.globalAlpha = i === idx ? 1 : 0.35;
      ctx.fillStyle = PALETTE[r.dynSeq[i]].dark;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    const frac = (time % r.dynPeriod) / r.dynPeriod;
    const ax = W / 2 + (idx - (r.dynSeq.length - 1) / 2) * 26;
    const ay = (y1 + y2) / 2;
    ctx.beginPath();
    ctx.arc(ax, ay, 10.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
    ctx.strokeStyle = PALETTE[r.dynSeq[idx]].dark;
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }
  if (r.morph && !r.solid) {
    const cy = (y1 + y2) / 2;
    ctx.beginPath();
    ctx.arc(W / 2 - 22, cy, 6, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE[r.color].dark;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W / 2 - 8, cy - 6); ctx.lineTo(W / 2 + 8, cy); ctx.lineTo(W / 2 - 8, cy + 6);
    ctx.closePath();
    ctx.fillStyle = '#5b6470';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(W / 2 + 22, cy, 6, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE[r.target].dark;
    ctx.fill();
  }
  if (r.safe && !r.solid) {
    const sx = W / 2, sy0 = (y1 + y2) / 2;
    ctx.beginPath();
    ctx.moveTo(sx, sy0 - 9);
    ctx.lineTo(sx + 7, sy0 - 6);
    ctx.lineTo(sx + 7, sy0);
    ctx.quadraticCurveTo(sx + 7, sy0 + 6, sx, sy0 + 9);
    ctx.quadraticCurveTo(sx - 7, sy0 + 6, sx - 7, sy0);
    ctx.lineTo(sx - 7, sy0 - 6);
    ctx.closePath();
    ctx.fillStyle = PALETTE[col].dark;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx - 3, sy0);
    ctx.lineTo(sx - 1, sy0 + 3);
    ctx.lineTo(sx + 4, sy0 - 3);
    ctx.stroke();
  }
}

function drawTopFlag() {
  if (!rings.length) return;
  let top = null;
  for (const r of rings) if (!r.danger && (!top || r.top > top.top)) top = r;
  if (!top) return;
  const y0 = sy(top.top), y1 = sy(top.bottom);
  if (y1 < -60 || y0 > H + 60) return;
  const bandH = y1 - y0;
  const cell = 8, cols = 2;
  const stripW = cell * cols;
  drawCheckerStrips(y0, bandH, cell, cols);
}
function drawCheckerStrips(y0, h, cell, cols) {
  const rows = Math.max(1, Math.ceil(h / cell));
  const stripW = cell * cols;
  const draw = (x0) => {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        ctx.fillStyle = (r + c) % 2 === 0 ? '#20242c' : '#ffffff';
        ctx.fillRect(x0 + c * cell, y0 + r * cell, cell, cell);
      }
    }
  };
  draw(WALL_L - 8 - stripW);
  draw(WALL_R + 8);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#F5ECDB';
  ctx.fillRect(0, 0, W, H);

  for (const r of rings) drawRing(r);
  drawTopFlag();

  const g0 = sy(0);
  const cornerR = 8;
  ctx.strokeStyle = '#8a94a3';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(WALL_L, -20);
  ctx.lineTo(WALL_L, g0 - cornerR);
  ctx.arcTo(WALL_L, g0, WALL_L + cornerR, g0, cornerR);
  ctx.lineTo(WALL_R - cornerR, g0);
  ctx.arcTo(WALL_R, g0, WALL_R, g0 - cornerR, cornerR);
  ctx.lineTo(WALL_R, -20);
  ctx.stroke();

  if (state === 'charging') {
    for (const d of chargeDots) {
      ctx.beginPath();
      ctx.arc(d.x, sy(d.y), 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, d.a).toFixed(3) + ')';
      ctx.fill();
    }
  }
  const by = sy(ball.y);
  const squash = state === 'charging' ? power * 0.32 : 0;
  if (squash > 0.01) {
    const rx = R * (1 + squash), ry = R * (1 - squash);
    const cy = by + R - ry;
    ctx.fillStyle = PALETTE[ball.color].dark;
    ctx.strokeStyle = 'rgba(0,0,0,.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(ball.x, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else {
    ctx.fillStyle = PALETTE[ball.color].dark;
    ctx.strokeStyle = 'rgba(0,0,0,.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(ball.x, by, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath();
    ctx.arc(ball.x - 4, by - 5, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // top bar (plain white)
  const hudH = 48;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, hudH);
  ctx.fillStyle = 'rgba(0,0,0,.08)';
  ctx.fillRect(0, hudH, W, 1);
  // pause button (top-left, circular)
  ctx.beginPath();
  ctx.arc(HUD_PAUSE.x, HUD_PAUSE.y, HUD_PAUSE.r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.15)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.strokeStyle = '#5b6470';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(HUD_PAUSE.x - 4, HUD_PAUSE.y - 6); ctx.lineTo(HUD_PAUSE.x - 4, HUD_PAUSE.y + 6);
  ctx.moveTo(HUD_PAUSE.x + 4, HUD_PAUSE.y - 6); ctx.lineTo(HUD_PAUSE.x + 4, HUD_PAUSE.y + 6);
  ctx.stroke();
  // level (center)
  ctx.fillStyle = '#333';
  ctx.font = '800 16px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillText('LEVEL ' + (levelIndex + 1), W / 2, 25);
  // health (top-right, bold red, close to heart)
  let hpScale = 1;
  if (hpFlashT > 0) hpScale = 1 + 0.25 * (hpFlashT / 0.6);
  const hpY = 25;
  ctx.textAlign = 'right';
  ctx.font = '800 ' + Math.round(16 * hpScale) + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  const hW = ctx.measureText(String(hp)).width;
  ctx.fillStyle = '#c0392b';
  ctx.fillText('♥', W - 14 - hW, hpY);
  ctx.fillText(String(hp), W - 14, hpY);
  if (hpFlashT > 0 && hpFlashT > 0.35) {
    ctx.fillStyle = '#e74c3c';
    ctx.font = '800 15px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('-1', W - 14 - hW - 20, hpY - 12);
  }
  if (safeFlashT > 0) {
    const k = safeFlashT / 0.8;              // 1 -> 0, animate over 0.8s
    const hx = W - 14 - hW;
    // green glow pulse around the heart
    ctx.beginPath();
    ctx.arc(hx - 12, hpY, 8 + 5 * (1 - k), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(47,163,107,' + (0.45 * k).toFixed(3) + ')';
    ctx.fill();
    // light sweep across the top bar (right -> left)
    const sweepX = W - 34 - (W - 120) * (1 - k);
    ctx.save();
    ctx.globalAlpha = 0.55 * k;
    const g = ctx.createLinearGradient(sweepX - 16, 0, sweepX + 16, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.5, 'rgba(255,255,255,.9)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(sweepX - 16, 8, 32, 32);
    ctx.restore();
  }

  if (state === 'charging') {
    const px = PWR.x, py = PWR.y, pw = PWR.w, ph = PWR.h;
    rr(px, py, pw, ph, 4);
    ctx.fillStyle = '#e3e6ea';
    ctx.fill();
    ctx.strokeStyle = '#9aa1ab';
    ctx.lineWidth = 1;
    ctx.stroke();
    if (power > 0.02) {
      const fillH = (ph - 4) * power;
      const g = ctx.createLinearGradient(0, py + ph, 0, py);
      g.addColorStop(0, '#2fa36b');
      g.addColorStop(0.5, '#e8b322');
      g.addColorStop(1, '#d94040');
      ctx.save();
      rr(px + 2, py + 2, pw - 4, ph - 4, 3);
      ctx.clip();
      ctx.fillStyle = g;
      ctx.fillRect(px, py + ph - fillH, pw, fillH);
      ctx.restore();
    }
  }

  const st = curStage();
  if (st) {
    drawCenterText(st.text, H * 0.5);
  } else if (levelIndex === 25 && curLevel().hint && l26HintA > 0) {
    ctx.globalAlpha = l26HintA;
    drawCenterText(curLevel().hint, H * 0.5);
    ctx.globalAlpha = 1;
  }
  if (hpRuleT > 0) {
    drawCenterText('血量为0时，本局结束', H * 0.5 + 46);
  }

  if (sliderOn) {
    const canSlide = state === 'idle';
    ctx.globalAlpha = canSlide ? 0.9 : 0.35;
    rr(SLIDER.x - 2, SLIDER.y, SLIDER.w + 4, SLIDER.h, 6);
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.fill();
    const leftMax = WALL_L + R, rightMax = WALL_R - R;
    const t = (ball.x - leftMax) / (rightMax - leftMax);
    const ky = SLIDER.y + t * SLIDER.h;
    ctx.beginPath();
    ctx.arc(SLIDER.x + SLIDER.w / 2, ky, 11, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.3)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (bannerT > 0 && state !== 'over' && state !== 'win') {
    ctx.fillStyle = 'rgba(32,36,44,' + (Math.min(1, bannerT) * 0.85).toFixed(3) + ')';
    ctx.font = '700 32px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(bannerText, W / 2, H * 0.4);
  }

  if (state === 'pause') {
    ctx.fillStyle = 'rgba(20,22,28,.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '700 30px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('暂停中', W / 2, H / 2 - 90);
    drawBtn(PZ_MENU, '选关');
    drawBtn(PZ_RESUME, '继续');
    drawBtn(PZ_RESTART, '重来');
  }

  if (state === 'over' || state === 'win') {
    const last = levelIndex === LEVELS.length - 1;
    ctx.fillStyle = 'rgba(20,22,28,.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '700 34px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(state === 'win' ? (last ? '全部通关！' : '通关！') : '游戏结束', W / 2, H / 2 - 30);
    drawBtn(BTN_A, '选关');
    drawBtn(BTN_B, state === 'win' ? (last ? '回到第1关' : '下一关') : '重试本关');
  }

  if (state === 'menu') {
    ctx.fillStyle = '#F5ECDB';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2a2f38';
    ctx.font = '700 26px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Reach the Ring', W / 2, 95);
    ctx.fillStyle = '#7a828d';
    ctx.font = '14px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('选择关卡', W / 2, 124);
    for (let i = 0; i < LEVELS.length; i++) {
      const c = menuCircle(i);
      if (c.y < 90 || c.y > H + 40) continue;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fillStyle = levelBg(i + 1);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.15)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = '700 18px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), c.x, c.y + 1);
      ctx.textBaseline = 'alphabetic';
    }
  }
}

function drawCenterText(text, y) {
  ctx.font = '600 16px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  const w = ctx.measureText(text).width + 34;
  ctx.fillStyle = 'rgba(32,36,44,.6)';
  rr(W / 2 - w / 2, y - 20, w, 40, 11);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, y);
  ctx.textBaseline = 'alphabetic';
}

function drawBtn(r, label) {
  rr(r.x, r.y, r.w, r.h, 10);
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = '600 16px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

function press(e) {
  if (e.cancelable) e.preventDefault();
  const pos = evtPos(e);
  if (state === 'menu') {
    menuDrag = true; menuDragY = pos.y; menuDownY = pos.y; menuMoved = false;
    return;
  }
  if (state === 'win' || state === 'over') {
    if (inRect(pos, BTN_A)) { state = 'menu'; return; }
    if (inRect(pos, BTN_B)) {
      loadLevel(state === 'win' ? (levelIndex + 1 < LEVELS.length ? levelIndex + 1 : 0) : levelIndex);
      return;
    }
    return;
  }
  if (state === 'pause') {
    if (inRect(pos, PZ_MENU)) { state = 'menu'; return; }
    if (inRect(pos, PZ_RESUME)) { state = 'idle'; return; }
    if (inRect(pos, PZ_RESTART)) { loadLevel(levelIndex); return; }
    return;
  }
  { const dx = pos.x - HUD_PAUSE.x, dy = pos.y - HUD_PAUSE.y; if (dx * dx + dy * dy <= HUD_PAUSE.r * HUD_PAUSE.r) { stopCharge(); state = 'pause'; return; } }
  if (state !== 'idle') return;
  if (sliderOn && inRect(pos, SLIDER_HIT)) { dragging = true; applySlider(pos); return; }
  hasInteracted = true;
  chargeT = 0; power = 0; chargeDots = [];
  startCharge();
  state = 'charging';
}
function moveH(e) {
  if (menuDrag) {
    const pos = evtPos(e);
    if (!menuMoved && Math.abs(pos.y - menuDownY) > 10) menuMoved = true;
    if (menuMoved) {
      menuPan += menuDragY - pos.y;
      menuDragY = pos.y;
      clampMenu();
    }
    return;
  }
  if (!dragging) return;
  if (e.cancelable) e.preventDefault();
  applySlider(evtPos(e));
}
function release(e) {
  if (e && e.cancelable) e.preventDefault();
  if (menuDrag) {
    menuDrag = false;
    if (!menuMoved && state === 'menu') {
      const pos = evtPos(e);
      for (let i = 0; i < LEVELS.length; i++) {
        const c = menuCircle(i);
        const dx = pos.x - c.x, dy = pos.y - c.y;
        if (dx * dx + dy * dy <= c.r * c.r) { loadLevel(i); return; }
      }
    }
    return;
  }
  if (dragging) { dragging = false; return; }
  if (state !== 'charging') return;
  const A = MIN_A + (MAX_A - MIN_A) * power;
  v = Math.sqrt(2 * G * A);
  const st = curStage();
  if (st && st.goal === 'jump') jumped = true;
  chargeDots = [];
  stopCharge();
  playLaunch();
  state = 'up';
}

canvas.addEventListener('mousedown', press);
window.addEventListener('mouseup', release);
canvas.addEventListener('touchstart', press, { passive: false });
canvas.addEventListener('touchend', release, { passive: false });
window.addEventListener('mousemove', moveH);
canvas.addEventListener('touchmove', moveH, { passive: false });
canvas.addEventListener('mouseenter', () => { hover = true; });
canvas.addEventListener('mouseleave', () => { hover = false; });
window.addEventListener('resize', fit);

fit();
loadLevel(0);
state = 'menu';
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.033, (t - last) / 1000);
  last = t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
